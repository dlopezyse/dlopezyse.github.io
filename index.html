<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego López Yse - Technical Articles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Robot Immigrants</h1>
        <p>👋🏻 Hi, I'm Diego López Yse, an AI researcher. This site lists my writings on various AI topics, including Machine Learning, NLP, Graphs, and more.</p>
    </header>
    <main>
        <div id="filter-container" style="text-align: center; margin-bottom: 15px;">
            <label for="category-filter"><strong>Filter by category:</strong></label>
            <select id="category-filter" style="margin-left: 10px; padding: 5px;">
                <option value="all">All</option>
                <option value="NLP">NLP</option>
                <option value="Graphs">Graphs</option>
                <option value="Machine Learning">Machine Learning</option>
            </select>
        </div>
        <section id="articles">
            <h2>My Articles</h2>
            <ul id="article-list"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Diego López Yse</p>
    </footer>
    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articles = [
                { title: "Your Guide to Natural Language Processing", date: "2024-12-01", category: "NLP", link: "nlp_guide.html" },
                { title: "Graph Neural Networks Explained", date: "2024-11-15", category: "Graphs", link: "graph_nn.html" },
                { title: "Optimizing Machine Learning Models", date: "2024-10-05", category: "Machine Learning", link: "ml_models.html" }
            ];
            
            const articleList = document.getElementById("article-list");
            const filter = document.getElementById("category-filter");
            
            function renderArticles(filterCategory) {
                articleList.innerHTML = "";
                articles.filter(article => filterCategory === "all" || article.category === filterCategory)
                    .forEach(article => {
                        const listItem = document.createElement("li");
                        listItem.innerHTML = `
                            <a href="${article.link}" class="article-title">${article.title}</a> - ${article.date}
                        `;
                        articleList.appendChild(listItem);
                    });
            }
            
            filter.addEventListener("change", () => {
                renderArticles(filter.value);
            });
            
            renderArticles("all");
        });
    </script>
</body>
</html>
