<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Immigrants</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Upper Section - Title & Subtitle -->
    <div id="upper-section">
        <h1>Robot Immigrants</h1>
        <p class="subtitle">Exploring AI and Beyond. By Diego López Yse</p>
    </div>

    <script>
        function scrambleText(element) {
            const originalText = element.dataset.text;
            let scrambledText = '';
            for (let char of originalText) {
                if (Math.random() < 0.8) {
                    scrambledText += String.fromCharCode(Math.floor(Math.random() * 94) + 33);
                } else {
                    scrambledText += char;
                }
            }
            element.dataset.scrambled = scrambledText;
        }

        const subtitle = document.querySelector('.subtitle');
        if (subtitle) {
            setInterval(() => scrambleText(subtitle), 500);
            scrambleText(subtitle);
        }
    </script>

    <!-- Middle Section - Filter & Articles -->
    <div id="middle-section">
        <h2 id="articles-title">Articles</h2>

        <div id="search-container">
            <label for="filter">Filter by topic:</label>
            <select id="filter">
                <option value="all">All</option>
                <!-- More filter options can be added -->
            </select>
        </div>

        <ul id="articles">
            <li><a href="#">Navigating the Vehicle Routing Problem (VRP) using Python - 2025-03-11</a></li>
            <li><a href="#">The Complete Guide to Decision Trees - 2019-04-14</a></li>
            <li><a href="#">Your Guide to Natural Language Processing (NLP) - 2019-01-15</a></li>
        </ul>
    </div>

    <!-- Lower Section - Footer -->
    <div id="footer-section">  
        <br><br>
        Find me <a href="https://github.com/dlopezyse" target="_blank" style="color: white; text-decoration: none;">@GitHub</a>
            <a href="https://www.linkedin.com/in/lopezyse/" target="_blank" style="color: white; text-decoration: none;">@LinkedIn</a>
    </div>

</body>
</html>
