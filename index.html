<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Zero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>System Zero</h1>
    <p>Navigate and Shape the AI Maze</p>
  </header>

  <nav id="filter-container">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="AI & Society">AI & Society</button>
    <button class="filter-btn" data-filter="Computer Vision">Computer Vision</button>
    <button class="filter-btn" data-filter="GenAI">GenAI</button>
    <button class="filter-btn" data-filter="Graphs">Graphs</button>
    <button class="filter-btn" data-filter="Machine Learning">Machine Learning</button>
    <button class="filter-btn" data-filter="NLP">NLP</button>
    <button class="filter-btn" data-filter="Programming">Programming</button>
  </nav>

  <main>
    <section id="article-grid"></section>
  </main>

  <footer>
    <p>
      Diego López Yse |
             <a href="https://github.com/dlopezyse" target="_blank">@GitHub</a> |
             <a href="https://www.linkedin.com/in/lopezyse/" target="_blank">@LinkedIn</a>
    </p>
  </footer>

  <script>
    // Fetch and render articles
    async function loadArticles() {
      const res = await fetch('articles.json');
      const articles = await res.json();
      renderArticles(articles);
      setupFilters(articles);
    }

    function renderArticles(articles, filter = "All") {
      const grid = document.getElementById('article-grid');
      grid.innerHTML = '';
      articles
        .filter(a => filter === "All" || a.category === filter)
        .forEach(article => {
          grid.innerHTML += `
            <article class="article-card">
              <a class="article-title" href="${article.url}">${article.title}</a>
              <div class="article-subtitle">${article.subtitle || ''}</div>
              <div class="article-meta">${article.category} &middot; ${article.date}</div>
            </article>
          `;
        });
    }

    function setupFilters(articles) {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderArticles(articles, btn.dataset.filter);
        });
      });
    }

    loadArticles();
  </script>
</body>
</html>
