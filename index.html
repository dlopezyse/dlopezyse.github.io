<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Machines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header">
        <h1>Wild Machines</h1>
        <p class="subtitle">A Blog to Navigate the AI Landscape</p>
    </div>

    <div id="content">
        <div id="filter-container">
            <label for="filter">Filter by topic:</label>
            <select id="filter">
                <option value="all">All</option>
                <option value="AI & Society">AI & Society</option>
                <option value="Computer Vision">Computer Vision</option>
                <option value="Graphs">Graphs</option>
                <option value="Machine Learning">Machine Learning</option>
                <option value="NLP">NLP</option>
                <option value="Programming">Programming</option>
            </select>
        </div>

        <ul id="article-list"></ul>
    </div>

    <div id="footer">
        <p>
            By: Diego López Yse |
            <a href="https://github.com/dlopezyse" target="_blank">@GitHub</a> |
            <a href="https://www.linkedin.com/in/lopezyse/" target="_blank">@LinkedIn</a>
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleList = document.getElementById("article-list");
            const filter = document.getElementById("filter");

            fetch("articles.json")
                .then(response => response.json())
                .then(articles => {
                    function renderArticles(filterCategory) {
                        articleList.innerHTML = ""; // Clear the list

                        articles
                            .filter(article => filterCategory === "all" || article.category === filterCategory)
                            .forEach(article => {
                                const listItem = document.createElement("li");
                                listItem.classList.add("article-item");

                                const titleLink = document.createElement("a");
                                titleLink.href = article.url;
                                titleLink.classList.add("article-title");
                                titleLink.textContent = article.title;

                                const subtitleDiv = document.createElement("div");
                                subtitleDiv.classList.add("article-subtitle");
                                subtitleDiv.textContent = article.subtitle;

                                const dateSpan = document.createElement("span");
                                dateSpan.classList.add("article-date");
                                dateSpan.textContent = article.date;

                                listItem.appendChild(titleLink);
                                listItem.appendChild(subtitleDiv);
                                listItem.appendChild(dateSpan);

                                articleList.appendChild(listItem);
                            });

                        if (articleList.innerHTML === "") {
                            articleList.innerHTML = "<li class='no-articles'>No articles found for this category.</li>";
                        }
                    }

                    filter.addEventListener("change", () => {
                        renderArticles(filter.value);
                    });

                    renderArticles("all"); // Initial display
                })
                .catch(error => {
                    console.error("Error loading articles:", error);
                    articleList.innerHTML = "<li class='error-loading'>Failed to load articles.</li>";
                });
        });
    </script>

</body>
</html>
