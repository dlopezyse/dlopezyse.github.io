<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Machines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header">
        <h1>Wild Machines <sub><</sub>/</h1>
        <p class="subtitle">A Blog to Navigate the AI Landscape</p>
    </div>

    <div id="content">
        <div id="filter-container">
            <label for="filter">Filter by topic:</label>
            <select id="filter">
                <option value="all">All</option>
                <option value="AI & Society">AI & Society</option>
                <option value="Computer Vision">Computer Vision</option>
                <option value="Graphs">Graphs</option>
                <option value="Machine Learning">Machine Learning</option>
                <option value="NLP">NLP</option>
                <option value="Programming">Programming</option>
            </select>
        </div>

        <div id="article-grid">
        </div>
    </div>

    <div id="footer">
        <p>
            By: Diego López Yse |
            <a href="https://github.com/dlopezyse" target="_blank">@GitHub</a> |
            <a href="https://www.linkedin.com/in/lopezyse/" target="_blank">@LinkedIn</a>
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articleGrid = document.getElementById("article-grid");
            const filter = document.getElementById("filter");

            fetch("articles.json")
                .then(response => response.json())
                .then(articles => {
                    function renderArticles(filterCategory) {
                        articleGrid.innerHTML = "";

                        articles
                            .filter(article => filterCategory === "all" || article.category === filterCategory)
                            .forEach((article, index) => {
                                const articleCard = document.createElement("div");
                                articleCard.classList.add("article-card");

                                const articleDetails = document.createElement("div");
                                articleDetails.classList.add("article-details");

                                const articleTitle = document.createElement("a");
                                articleTitle.href = article.url;
                                articleTitle.classList.add("article-title");
                                articleTitle.textContent = article.title;

                                const articleSubtitle = document.createElement("p");
                                articleSubtitle.classList.add("article-subtitle");
                                articleSubtitle.textContent = article.subtitle;

                                const articleDate = document.createElement("span");
                                articleDate.classList.add("article-date");
                                articleDate.textContent = article.date;

                                articleDetails.appendChild(articleTitle);
                                articleDetails.appendChild(articleSubtitle);
                                articleDetails.appendChild(articleDate);

                                articleCard.appendChild(articleDetails);
                                articleGrid.appendChild(articleCard);
                            });

                        if (articleGrid.innerHTML === "") {
                            articleGrid.innerHTML = "<p class='no-articles'>No articles found for this category.</p>";
                        }
                    }

                    filter.addEventListener("change", () => {
                        renderArticles(filter.value);
                    });

                    renderArticles("all");
                })
                .catch(error => {
                    console.error("Error loading articles:", error);
                    articleGrid.innerHTML = "<p class='error-loading'>Failed to load articles.</p>";
                });
        });
    </script>

</body>
</html>
