<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Immigrants</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Upper Section - Title & Subtitle -->
    <div id="upper-section">
        <h1>Robot Immigrants<span class="cursor">|</span></h1>
        <p class="subtitle">The Blog to Hack the AI Gap</p>
    </div>

    <!-- Middle Section - Filter & Articles -->
    <div id="middle-section">
        <h2 id="articles-title">Articles</h2>

        <div id="search-container">
            <label for="filter">Filter by topic:</label>
            <select id="filter">
                <option value="all">All</option>
                <option value="NLP">NLP</option>
                <option value="Graphs">Graphs</option>
                <option value="Machine Learning">Machine Learning</option>
            </select>
        </div>
            <ul id="article-list"></ul>
    </div>

    <!-- Lower Section - Footer -->
    <div id="footer-section">  
        <br><br>
        By Diego López Yse. Find me <a href="https://github.com/dlopezyse" target="_blank" style="color: white; text-decoration: none;">@GitHub</a>
            <a href="https://www.linkedin.com/in/lopezyse/" target="_blank" style="color: white; text-decoration: none;">@LinkedIn</a>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const articles = [
                { title: "Your Guide to Natural Language Processing", date: "2024-12-01", category: "NLP", link: "nlp_guide.html" },
                { title: "Graph Neural Networks Explained", date: "2024-11-15", category: "Graphs", link: "graph_nn.html" },
                { title: "Optimizing Machine Learning Models", date: "2024-10-05", category: "Machine Learning", link: "ml_models.html" }
            ];
            
            const articleList = document.getElementById("article-list");
            const filter = document.getElementById("filter");
            
            function renderArticles(filterCategory) {
                articleList.innerHTML = "";
                articles.filter(article => filterCategory === "all" || article.category === filterCategory)
                    .forEach(article => {
                        const listItem = document.createElement("li");
                        listItem.innerHTML = `
                            <a href="${article.link}" class="article-title">${article.title}</a> - ${article.date}
                        `;
                        articleList.appendChild(listItem);
                    });
            }
            
            filter.addEventListener("change", () => {
                renderArticles(filter.value);
            });
            
            renderArticles("all");
        });
    </script>

</body>
</html>
